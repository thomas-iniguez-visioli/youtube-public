<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Chargement - YouTube Local</title>
    <style>
        body {
            background-color: #080808;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #ff0000;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-weight: 300;
            margin: 0 0 10px 0;
        }
        p {
            color: #888888;
            font-size: 0.9rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>Préparation de votre bibliothèque</h2>
    <p>Synchronisation de la base de données et des miniatures en cours...</p>
</body>
</html>

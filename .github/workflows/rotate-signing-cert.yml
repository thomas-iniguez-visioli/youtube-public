name: Rotation du certificat de signature

on:
  schedule:
    - cron: '0 4 1 1 *'
  workflow_dispatch:
    inputs:
      cutover:
        description: 'Basculer WIN_CSC_LINK et WIN_CSC_KEY_PASSWORD apres publication de la release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  rotate:
    name: Generer et publier le nouveau certificat
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Activer les chemins longs Git
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Generer les certificats (PKI 2-tiers)
        id: cert
        shell: pwsh
        env:
          PREV_CA_LINK: ${{ secrets.WIN_CA_LINK }}
          PREV_CA_KEY_PASSWORD: ${{ secrets.WIN_CA_KEY_PASSWORD }}
          PREV_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          PREV_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Mots de passe distincts pour les deux PFX
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $bytesCa = New-Object byte[] 24
          $rng.GetBytes($bytesCa)
          $caPassword = ($bytesCa | ForEach-Object { $_.ToString('x2') }) -join ''

          $bytesCsc = New-Object byte[] 24
          $rng.GetBytes($bytesCsc)
          $cscPassword = ($bytesCsc | ForEach-Object { $_.ToString('x2') }) -join ''

          # 1. Importer l'ancien signataire CA (depuis WIN_CA_LINK en priorite, ou fallback WIN_CSC_LINK)
          $prevCa = $null
          $prevCas = @()
          $caLink = if ($env:PREV_CA_LINK) { $env:PREV_CA_LINK } else { $env:PREV_CSC_LINK }
          $caPwd = if ($env:PREV_CA_KEY_PASSWORD) { $env:PREV_CA_KEY_PASSWORD } else { $env:PREV_CSC_KEY_PASSWORD }

          if ($caLink -and $caPwd) {
            $prevPfxPath = Join-Path $env:RUNNER_TEMP 'previous-ca.pfx'
            [IO.File]::WriteAllBytes($prevPfxPath, [Convert]::FromBase64String($caLink))
            $prevSecure = ConvertTo-SecureString $caPwd -AsPlainText -Force
            $imported = Import-PfxCertificate -FilePath $prevPfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $prevSecure -Exportable
            Remove-Item $prevPfxPath -Force
            foreach ($c in $imported) {
              $bc = $c.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.19' }
              if ($bc -and ([System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]$bc).CertificateAuthority -and $c.HasPrivateKey) {
                $prevCas += $c
              }
            }
            if ($prevCas.Count -gt 0) {
              $prevCa = $prevCas | Sort-Object NotAfter -Descending | Select-Object -First 1
              Write-Host "Certificat CA precedent importe pour contre-signature : $($prevCa.Thumbprint)"
            }
          }

          $subject = 'CN=spartan_arbinger'

          # 2. Generer le certificat d'Autorite Racine (Root CA)
          # Signe par le Root CA precedent si disponible
          $caCommon = @{
            Subject           = $subject
            FriendlyName      = 'spartan_arbinger Root CA'
            KeyAlgorithm      = 'RSA'
            KeyLength         = 2048
            HashAlgorithm     = 'SHA256'
            KeyExportPolicy   = 'Exportable'
            CertStoreLocation = 'Cert:\CurrentUser\My'
            NotAfter          = (Get-Date).AddYears(5)
          }

          if ($prevCa) {
            $caCert = New-SelfSignedCertificate @caCommon `
              -Type Custom `
              -Signer $prevCa `
              -KeyUsage CertSign, CRLSign `
              -TextExtension @(
                '2.5.29.19={critical}{text}ca=true'
              )
            Write-Host "Nouveau certificat CA signe par le Root CA precedent $($prevCa.Thumbprint)"
          } else {
            $caCert = New-SelfSignedCertificate @caCommon `
              -Type Custom `
              -KeyUsage CertSign, CRLSign `
              -TextExtension @(
                '2.5.29.19={critical}{text}ca=true'
              )
            Write-Host "Certificat CA racine initial cree : $($caCert.Thumbprint)"
          }

          # 3. Generer le certificat de signature d'application (Code Signing Leaf)
          # Signe par le CA ci-dessus, KeyUsage DigitalSignature, EKU CodeSigning, sans ca=true
          $appCommon = @{
            Subject           = $subject
            FriendlyName      = 'spartan_arbinger Code Signing'
            KeyAlgorithm      = 'RSA'
            KeyLength         = 2048
            HashAlgorithm     = 'SHA256'
            KeyExportPolicy   = 'Exportable'
            CertStoreLocation = 'Cert:\CurrentUser\My'
            NotAfter          = (Get-Date).AddYears(2)
          }

          $appCert = New-SelfSignedCertificate @appCommon `
            -Type Custom `
            -Signer $caCert `
            -KeyUsage DigitalSignature `
            -TextExtension @(
              '2.5.29.37={text}1.3.6.1.5.5.7.3.3'
            )
          Write-Host "Certificat de signature d'application cree : $($appCert.Thumbprint) (signe par $($caCert.Thumbprint))"

          # 4. Exporter les 2 certificats publics .cer dans signing-certs/
          New-Item -ItemType Directory -Force -Path signing-certs | Out-Null
          $caThumb = $caCert.Thumbprint
          $appThumb = $appCert.Thumbprint
          Export-Certificate -Cert $caCert -FilePath (Join-Path 'signing-certs' "$caThumb.cer") | Out-Null
          Export-Certificate -Cert $appCert -FilePath (Join-Path 'signing-certs' "$appThumb.cer") | Out-Null

          # 5a. Exporter le PFX Root CA (WIN_CA_LINK) avec ses cles privees pour les prochaines rotations
          $caColl = [System.Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
          $caColl.Add($caCert) | Out-Null
          if ($prevCas.Count -gt 0) {
            foreach ($oldCa in $prevCas) {
              if ($oldCa.Thumbprint -ne $caCert.Thumbprint) {
                $caColl.Add($oldCa) | Out-Null
              }
            }
          }
          $caPfxBytes = $caColl.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx, $caPassword)

          $caPfxPath = Join-Path $env:RUNNER_TEMP 'ca.pfx'
          [System.IO.File]::WriteAllBytes($caPfxPath, $caPfxBytes)
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'ca_link.b64') -Value ([Convert]::ToBase64String($caPfxBytes)) -NoNewline -Encoding ascii
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'ca_password.txt') -Value $caPassword -NoNewline -Encoding ascii
          Remove-Item $caPfxPath -Force

          # 5b. Exporter le PFX Leaf d'application (WIN_CSC_LINK) pour electron-builder
          $leafColl = [System.Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
          $leafColl.Add($appCert) | Out-Null
          $leafColl.Add([System.Security.Cryptography.X509Certificates.X509Certificate2]::new($caCert.RawData)) | Out-Null
          if ($prevCas.Count -gt 0) {
            foreach ($oldCa in $prevCas) {
              $leafColl.Add([System.Security.Cryptography.X509Certificates.X509Certificate2]::new($oldCa.RawData)) | Out-Null
            }
          }
          $leafPfxBytes = $leafColl.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx, $cscPassword)

          $leafPfxPath = Join-Path $env:RUNNER_TEMP 'leaf.pfx'
          [System.IO.File]::WriteAllBytes($leafPfxPath, $leafPfxBytes)
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'csc_link.b64') -Value ([Convert]::ToBase64String($leafPfxBytes)) -NoNewline -Encoding ascii
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'csc_password.txt') -Value $cscPassword -NoNewline -Encoding ascii
          Remove-Item $leafPfxPath -Force

          "ca_thumbprint=$caThumb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ca_file=$caThumb.cer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "app_thumbprint=$appThumb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "app_file=$appThumb.cer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "thumbprint=$appThumb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "file=$appThumb.cer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $signedBy = if ($prevCa) { $prevCa.Thumbprint } else { 'self' }
          "signed-by=$signedBy" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Ajouter le certificat a la liste de confiance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $listPath = 'signing-certs/trusted.json'
          $existing = @()
          if (Test-Path $listPath) {
            $existing = @(Get-Content $listPath -Raw | ConvertFrom-Json)
          }
          $caThumb = '${{ steps.cert.outputs.ca_thumbprint }}'
          $appThumb = '${{ steps.cert.outputs.app_thumbprint }}'
          $incoming = @($caThumb, $appThumb)
          $kept = @($existing | Where-Object { $_.thumbprint -and $_.thumbprint -notin $incoming } | Sort-Object addedAt | Select-Object -Last 4)
          $today = (Get-Date -Format 'yyyy-MM-dd')
          $kept += [pscustomobject]@{
            file       = '${{ steps.cert.outputs.ca_file }}'
            thumbprint = $caThumb
            subject    = 'CN=spartan_arbinger'
            addedAt    = $today
          }
          $kept += [pscustomobject]@{
            file       = '${{ steps.cert.outputs.app_file }}'
            thumbprint = $appThumb
            subject    = 'CN=spartan_arbinger'
            addedAt    = $today
          }
          $kept | ConvertTo-Json -Depth 4 | Set-Content -Path $listPath -Encoding utf8
          Get-Content $listPath

      - name: Incrementer la version
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const raw=fs.readFileSync('package.json','utf8');const p=JSON.parse(raw);const v=p.version.split('.');const patch=Number.parseInt(v[2],10);if(!Number.isFinite(patch))throw new Error('version '+p.version);p.version=v[0]+'.'+v[1]+'.'+(patch+1);fs.writeFileSync('package.json',JSON.stringify(p,null,2)+(raw.endsWith('\n')?'\n':''));console.log('nouvelle version '+p.version)"

      - name: Publier la confiance du nouveau certificat
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing-certs package.json
          git status --short
          git commit -m "chore: rotation du certificat de signature"
          git push

      - name: Attendre la release signee avec le certificat actuel
        id: wait
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          for ($i = 0; $i -lt 120; $i++) {
            $raw = gh release view "v$version" --json assets,isDraft 2>$null
            if ($LASTEXITCODE -eq 0 -and $raw) {
              $info = $raw | ConvertFrom-Json
              if (-not $info.isDraft -and $info.assets.Count -ge 2) {
                "etat=publiee" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
                exit 0
              }
            }
            Start-Sleep -Seconds 30
          }
          "etat=timeout" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          throw "La release v$version n'a pas ete publiee en 60 minutes, cutover annule"

      - name: Basculer le signing sur les nouveaux certificats (4 secrets)
        id: cutover
        if: ${{ github.event_name == 'schedule' || inputs.cutover }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          # 1. Mettre a jour les secrets de signature d'application (Leaf)
          cmd /c "type `"$env:RUNNER_TEMP\csc_link.b64`" | gh secret set WIN_CSC_LINK -R $env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'echec de mise a jour de WIN_CSC_LINK' }
          cmd /c "type `"$env:RUNNER_TEMP\csc_password.txt`" | gh secret set WIN_CSC_KEY_PASSWORD -R $env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'echec de mise a jour de WIN_CSC_KEY_PASSWORD' }

          # 2. Mettre a jour les secrets de l'Autorite Racine (Root CA)
          cmd /c "type `"$env:RUNNER_TEMP\ca_link.b64`" | gh secret set WIN_CA_LINK -R $env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'echec de mise a jour de WIN_CA_LINK' }
          cmd /c "type `"$env:RUNNER_TEMP\ca_password.txt`" | gh secret set WIN_CA_KEY_PASSWORD -R $env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'echec de mise a jour de WIN_CA_KEY_PASSWORD' }

          Remove-Item (Join-Path $env:RUNNER_TEMP 'csc_link.b64'), (Join-Path $env:RUNNER_TEMP 'csc_password.txt'), (Join-Path $env:RUNNER_TEMP 'ca_link.b64'), (Join-Path $env:RUNNER_TEMP 'ca_password.txt') -Force
          Write-Host 'Les 4 secrets ont ete bascules avec succes sur le depot'

      - name: Resume
        if: always()
        shell: pwsh
        run: |
          $lines = @(
            '### Rotation du certificat de signature',
            '',
            '| Champ | Valeur |',
            '| --- | --- |',
            '| Certificat racine (CA) | ${{ steps.cert.outputs.ca_thumbprint }} (${{ steps.cert.outputs.ca_file }}) |',
            '| Certificat d\'application | ${{ steps.cert.outputs.app_thumbprint }} (${{ steps.cert.outputs.app_file }}) |',
            '| Signe par | ${{ steps.cert.outputs.signed-by }} |',
            '| Release attendue | v${{ steps.wait.outputs.version }} |',
            '| Etat release | ${{ steps.wait.outputs.etat }} |',
            '| Cutover secrets | ${{ steps.cutover.outcome }} |'
          )
          $lines | Add-Content -Path $env:GITHUB_STEP_SUMMARY

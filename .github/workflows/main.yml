name: Build/Release

on:
  repository_dispatch:
    types: [build-triggered]
  workflow_dispatch:
  push:
    branches: main

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# SignPath (optionnel) — pour activer la signature publique gratuite :
#   secrets.SIGNPATH_API_TOKEN
#   vars.SIGNPATH_ORGANIZATION_ID   (si défini → bascule SignPath)
#   vars.SIGNPATH_PROJECT_SLUG
#   vars.SIGNPATH_SIGNING_POLICY_SLUG
# Sans ces variables, le build self-signed actuel est utilisé.

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from package.json
        id: version
        run: echo "version=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      - name: Create Draft Release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes '### YouTube Downloader Extension' \
            --draft || echo "Release draft already exists"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

  build-and-upload:
    name: Build and Upload Assets
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      actions: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
      - name: Setup LaunchDarkly config
        shell: bash
        env:
          LD_CLIENT_ID: ${{ secrets.LAUNCHDARKLY_CLIENT_ID }}
        run: |
          if [ -z "$LD_CLIENT_ID" ]; then
            echo "::warning::LAUNCHDARKLY_CLIENT_ID est vide, les feature flags utiliseront les valeurs par défaut"
          fi
          cat > launchdarkly.config.cjs <<EOF
          module.exports = {
            clientSideId: '${LD_CLIENT_ID}',
            environment: 'production',
          };
          EOF
      - name: Setup Rollbar config
        run: |
         echo "module.exports = {
               accessToken: '${{ secrets.ROLLBAR_ACCESS_TOKEN }}',
          environment: 'production',
          captureUncaught: true,
          captureUnhandledRejections: true,
           };" > rollbar.config.cjs

      - name: Build Electron app (self-signed)
        if: matrix.os != 'windows-latest' || vars.SIGNPATH_ORGANIZATION_ID == ''
        run: bunx electron-builder --publish always
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build Electron app (unsigned, pour SignPath)
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        run: bunx electron-builder --publish never
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Upload unsigned Windows binaries
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-win-binaries
          path: dist/*.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-win

      - name: Publish signed assets (SignPath)
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const latestPath = 'dist/latest.yml';
          let yml = fs.readFileSync(latestPath, 'utf8');
          const m = yml.match(/^path:\s*(.+)$/m) || yml.match(/url:\s*(.+)/);
          if (!m) {
            console.error('latest.yml: aucun path/url trouvé');
            process.exit(1);
          }
          const fname = m[1].trim().replace(/^["']|["']$/g, '');

          function findFile(dir, name) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) {
                const r = findFile(p, name);
                if (r) return r;
              } else if (e.name === name) return p;
            }
            return null;
          }

          const signed = findFile('signed-win', fname);
          if (!signed) {
            console.error('Fichier signé introuvable:', fname);
            console.error(fs.readdirSync('signed-win', { recursive: true }));
            process.exit(1);
          }

          const hash = crypto.createHash('sha512').update(fs.readFileSync(signed)).digest('base64');
          const count = (yml.match(/sha512:/g) || []).length;
          if (count !== 1) {
            console.error('sha512 inattendu dans latest.yml:', count);
            process.exit(1);
          }
          yml = yml.replace(/sha512:\s*\S+/, 'sha512: ' + hash);
          fs.writeFileSync(latestPath, yml);
          console.log('latest.yml mis à jour pour', fname);
          EOF

          shopt -s nullglob
          mapfile -t exes < <(find signed-win -type f -name '*.exe')
          if [ ${#exes[@]} -eq 0 ]; then
            echo "Aucun exe signé trouvé" >&2
            exit 1
          fi
          zips=(dist/*.zip)
          gh release upload "v${VERSION}" "${exes[@]}" dist/latest.yml ${zips[@]+"${zips[@]}"} --clobber

      - name: Upload latest.yml for Auto-Update (Windows)
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID == ''
        run: |
          gh release upload v${{ needs.prepare-release.outputs.version }} dist/latest.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Create and Upload extension ZIP
        if: matrix.os == 'ubuntu-latest'
        run: |
          zip -r youtube-downloader-extension.zip extension/
          gh release upload v${{ needs.prepare-release.outputs.version }} youtube-downloader-extension.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish Release
    needs: [prepare-release, build-and-upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish Draft Release
        run: gh release edit v${{ needs.prepare-release.outputs.version }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
